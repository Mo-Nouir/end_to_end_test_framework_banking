name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_URL: https://parabank.parasoft.com/parabank
  API_BASE_URL: https://parabank.parasoft.com/parabank/services/bank
  # Keep concurrency very low against the shared Cloudflare-fronted demo
  WORKERS: '1'
  CI: 'true'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  smoke:
    name: Smoke tests (Chromium)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Soft gate: public ParaBank flakes should not block the full browser matrix.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite (@smoke)
        run: npm run test:smoke
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-smoke
          path: test-results/
          retention-days: 7

  full-suite:
    name: Full suite (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, smoke]
    if: ${{ always() && needs.lint-and-typecheck.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run full suite for ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  publish-report:
    name: Publish report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, full-suite, smoke]
    # Publish latest Chromium report on main (even if some tests failed).
    if: ${{ always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.lint-and-typecheck.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Chromium Playwright report
        id: chromium-report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-chromium
          path: _site

      - name: Fallback to smoke report
        if: ${{ steps.chromium-report.outcome != 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-smoke
          path: _site

      - name: Ensure report exists
        run: |
          if [ ! -f "_site/index.html" ]; then
            echo "No Playwright HTML report artifact found to publish."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
