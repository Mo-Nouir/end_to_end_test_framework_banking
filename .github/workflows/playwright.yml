name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_URL: https://parabank.parasoft.com/parabank
  API_BASE_URL: https://parabank.parasoft.com/parabank/services/bank
  # Keep concurrency very low against the shared Cloudflare-fronted demo
  WORKERS: '1'
  CI: 'true'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  smoke:
    name: Smoke tests (Chromium)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Soft gate: public ParaBank flakes should not block the full browser matrix.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite (@smoke)
        run: npm run test:smoke
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-smoke
          path: blob-report
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-smoke
          path: test-results/
          retention-days: 7

  full-suite:
    name: Full suite (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, smoke]
    if: ${{ always() && needs.lint-and-typecheck.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Chromium is always installed: apiSession registers users via Chromium even on Firefox/WebKit jobs.
        run: |
          npx playwright install --with-deps ${{ matrix.project }}
          if [ "${{ matrix.project }}" != "chromium" ]; then
            npx playwright install chromium
          fi

      - name: Run full suite for ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  publish-report:
    name: Publish merged report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, full-suite, smoke]
    # Merge Chromium + Firefox + WebKit (+ smoke) into one HTML report on main.
    if: ${{ always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.lint-and-typecheck.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports into HTML
        run: |
          if [ ! -d "all-blob-reports" ] || [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "No blob reports found to merge."
            exit 1
          fi
          npx playwright merge-reports --reporter html ./all-blob-reports
          mkdir -p _site
          cp -r playwright-report/. _site/

      - name: Ensure report exists
        run: |
          if [ ! -f "_site/index.html" ]; then
            echo "Merged Playwright HTML report was not produced."
            exit 1
          fi

      - name: Upload merged HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: _site/
          retention-days: 14

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
